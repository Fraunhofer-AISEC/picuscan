name: Build app image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile.base'
      - 'Containerfile'
      - .github/workflows/build-base-image.yml
      - .github/workflows/build-app-image.yml
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/**'
      - 'src/**'
      - 'tests/**'
      - 'typings/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    # On PRs, only build amd64 (arm64 base image may not exist yet).
    # Both arches are built on push to main.
    if: github.event_name != 'pull_request' || matrix.arch == 'amd64'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build app image
        uses: ./.github/actions/container
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          containerfile: Containerfile
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          run-e2e: "true"
          # Only push when merged to main
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  manifest-app:
    needs: build-app
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge app manifest
        uses: ./.github/actions/manifest
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
