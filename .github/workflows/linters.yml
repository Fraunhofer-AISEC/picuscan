name: linters

on:
  push:
    branches:
    - main
  pull_request:
    paths:
    - 'pyproject.toml'
    - 'uv.lock'
    - '.github/**'
    - 'src/**'
    - 'tests/**'
    - 'typings/**'

jobs:
  linters:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run reuse lint
      run: |
        uv run just lint-reuse

    - name: Run ruff check
      run: |
        uv run just lint-ruff-check

    - name: Run ruff format
      run: |
        uv run just lint-ruff-format

  type-checks:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run mypy
      run: |
        uv run just lint-mypy

    - name: Run ty
      run: |
        uv run just lint-ty

  pytest:
    needs: [linters, type-checks]

    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run pytest
      run: |
        git config --global user.name "Max Mustermann"
        git config --global user.email "max.mustermann@example.com"
        uv run pytest
