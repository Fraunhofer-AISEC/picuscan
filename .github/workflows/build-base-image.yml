name: Build base and app image

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile.base'
      - .github/workflows/build-base-image.yml
  workflow_dispatch: {}        # manual trigger from the Actions tab
  schedule:
    - cron: '0 3 1 * *'        # optional: monthly rebuild for OS security updates

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build base image
        uses: ./.github/actions/container
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ github.repository }}-base
          containerfile: Containerfile.base
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          push: "true"
          run-e2e: "false"
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  manifest-base:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge base manifest
        uses: ./.github/actions/manifest
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ github.repository }}-base
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    needs: manifest-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build app image
        uses: ./.github/actions/container
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ github.repository }}
          containerfile: Containerfile
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          push: "true"
          run-e2e: "true"
          base-image: ${{ github.ref_name }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  manifest-app:
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge app manifest
        uses: ./.github/actions/manifest
        with:
          registry: ${{ env.REGISTRY }}
          image-name: ${{ github.repository }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
