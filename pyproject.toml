[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project]
name = "picuscan"
version = "1.0.0rc3"
description = "A unified orchestration and enrichment layer for C/C++ static analysis tools"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "AISEC Code Audit Team"}]
maintainers = [
  { name = "Tobias Specht", email = "tobias.specht@aisec.fraunhofer.de" },
  { name = "Hannah Schmid", email = "hannah.schmid@aisec.fraunhofer.de" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.12,<3.16"
dependencies = [
  "attrs>=25.2.0",
  "cattrs>=25.1.0",
  "click>=8.0.3",
  "neo4j>=6.0.1",
  "networkx>=3.0",
  "tqdm>=4.68.4",
  "xmltodict>=1.0.0",
  "pandas>=2.0.3",
  "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
  "ruff>=0.17.0",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "pytest-mock>=3.15.1",
  "pandas-stubs>=2.3.2.250926",
  "mypy>=2.3.0",
  "ty>=0.0.86",
  "rust-just>=1.38.0",
  "types-tqdm>=4.68.0.20260608",
  "types-xmltodict>=1.0.1.20260518",
  "types-networkx>=3.6.1.20260624",
  "types-tabulate>=0.9.0.20241207",
  "typing-extensions>=4.0.1",
  "reuse>=6.2.0",
]

[project.scripts]
picuscan = "picuscan:main"

[project.urls]
Documentation = "https://github.com/Fraunhofer-AISEC/picuscan"
Repository = "https://github.com/Fraunhofer-AISEC/picuscan"
"Bug Tracker" = "https://github.com/Fraunhofer-AISEC/picuscan/issues"

[tool.uv]
package = true

[tool.setuptools.package-data]
picuscan = ["res/*"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["docs/"]

[tool.ruff.lint]
# extend-select adds to ruff's own (already fairly broad) default rule set,
# instead of replacing it like `select` would. The defaults only contain a
# subset of most rule families; the families listed here are enabled completely.
extend-select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle
    "F",    # pyflakes
    "FURB", # refurb
    "I",    # isort
    "IC",   # flake8-import-conventions
    "LOG",  # flake8-logging
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "TD",   # flake8-todos
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
]
ignore = [
    "E402",     # Module level import not at top of file
    "E501",     # line length
    "PLR2004",  # magic value used in comparison
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments to function call
    "PLR0915",  # too many statements
    "PLR0917",  # too many positional arguments
    "PLC1901",  # empty string is falsey
    "TD001",    # Invalid TODO tag: {tag}
    "TD002",    # Missing author in TODO; try: # TODO(<author_name>): ... or # TODO @<author_name>: ...
    "TD003",    # Missing issue link on the line following this TODO
    "A002",     # Function argument is shadowing a Python builtin (would rename public API parameters)
    "A005",     # Module `typing` shadows a Python standard-library module
    "PLC0415",  # `import` should be at the top-level of a file
    "BLE001",   # Do not catch blind exception
    "S110",     # `try`-`except`-`pass` detected, consider logging the exception
    "RUF012",   # Mutable default value for class attribute
    "SIM102",   # Use a single `if` statement instead of nested `if` statements
]

[tool.ruff.lint.per-file-ignores]
# third-party type stubs
"typings/**" = ["UP040", "UP046", "PYI"]
# `dir`, `file`, `args`, `path`, `cmd` are part of the documented Python API
# of the `compile-commands select` expressions (see docs/usage.md)
"src/picuscan/commands/compile_commands.py" = ["A001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
strict = true
native_parser = true
num_workers = "auto"
files = ["src"]

# The vendored cattrs glue passes `AttributeOverride` objects as `**kwargs` to
# the cattrs gen functions, which their type stubs do not model.
[[tool.ty.overrides]]
include = ["src/picuscan/common/cattrs/**"]
rules = { invalid-argument-type = "ignore" }


